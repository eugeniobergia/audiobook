services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: .
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      API_KEY: ${API_KEY}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # Optional: no value here, so each is passed through only when set (in .env
      # or the shell). When unset it's left out, and the app's default applies.
      DB_POOL_MAX:
      ITUNES_BASE_URL:
      ITUNES_TIMEOUT_SECONDS:
      PALETTE_CONCURRENCY:
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Healthy once the app answers /health (after it connected to Postgres and
    # applied the schema), so `docker compose up --wait` waits for a usable API.
    # Python instead of curl: the slim image has no curl.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

volumes:
  pgdata:
